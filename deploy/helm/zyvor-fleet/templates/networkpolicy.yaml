{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zyvor-fleet.name" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "zyvor-fleet.labels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8080}
{{- end }}
