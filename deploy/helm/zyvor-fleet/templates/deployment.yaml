apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zyvor-fleet.name" . }}
  labels:
    {{- include "zyvor-fleet.labels" . | nindent 4 }}
spec:
  # v0.2 uses an embedded single-writer store. Keep one replica.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "zyvor-fleet.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zyvor-fleet.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: fleetd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--listen", ":8080", "--data", "/var/lib/zyvor-fleet/state.json"]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: ZYVOR_FLEET_ADMIN_EMAIL, value: {{ .Values.admin.email | quote }}}
            - name: ZYVOR_FLEET_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ default (include "zyvor-fleet.name" .) .Values.existingSecret }}, key: admin-password}}
            - name: ZYVOR_FLEET_SESSION_SECRET
              valueFrom: {secretKeyRef: {name: {{ default (include "zyvor-fleet.name" .) .Values.existingSecret }}, key: session-secret}}
            - {name: ZYVOR_FLEET_SECURE_COOKIES, value: {{ ternary "1" "0" .Values.secureCookies | quote }}}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/zyvor-fleet}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ include "zyvor-fleet.name" . }}}
          {{- else }}
          emptyDir: {}
          {{- end }}
