apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zyvor-fleet-default
  namespace: zyvor-fleet
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: zyvor-fleet}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
