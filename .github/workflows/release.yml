name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/fleetd-${GOOS}-${GOARCH}" ./cmd/fleetd
          go build -trimpath -ldflags="-s -w -X github.com/zyvorai/zyvor-fleet/internal/agent.Version=${VERSION}" -o "dist/fleet-agent-${GOOS}-${GOARCH}" ./cmd/fleet-agent
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/fleetctl-${GOOS}-${GOARCH}" ./cmd/fleetctl
          cd dist && sha256sum * > "SHA256SUMS-${GOOS}-${GOARCH}.txt"
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          provenance: true
          sbom: true
