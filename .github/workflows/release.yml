name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/fleetd-${GOOS}-${GOARCH}" ./cmd/fleetd
          go build -trimpath -ldflags="-s -w -X github.com/zyvorai/fleet/internal/agent.Version=${VERSION}" -o "dist/fleet-agent-${GOOS}-${GOARCH}" ./cmd/fleet-agent
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/fleetctl-${GOOS}-${GOARCH}" ./cmd/fleetctl
          cd dist && sha256sum * > "SHA256SUMS-${GOOS}-${GOARCH}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Assemble dist and unified checksums
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          # Prefer a single SHA256SUMS covering all binaries (ignore per-arch lists).
          rm -f SHA256SUMS SHA256SUMS-*.txt
          sha256sum fleetd-* fleet-agent-* fleetctl-* > SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Zyvor Fleet ${{ github.ref_name }}

            Verify `SHA256SUMS` with Cosign against this workflow identity, then `sha256sum -c SHA256SUMS`.
            Qualification status: see `docs/QUALIFICATION.md` (not implied by the tag alone).
            OTA device contract: `docs/OTA_CONTRACT.md`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          provenance: true
          sbom: true
